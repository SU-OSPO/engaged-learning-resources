name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Django ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12.8"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teachorange
          POSTGRES_PASSWORD: teachorange
          POSTGRES_DB: teaching_activities
        ports:
          - 5432:5432
        # The test runner creates test_<db>, so wait until the server truly accepts connections.
        options: >-
          --health-cmd "pg_isready -U teachorange"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://teachorange:teachorange@localhost:5432/teaching_activities
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test --verbosity 2

      - name: Django deployment checks
        run: python manage.py check --deploy --fail-level WARNING
