name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Django ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12.8"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teachorange
          POSTGRES_PASSWORD: teachorange
          POSTGRES_DB: teaching_activities
        ports:
          - 5432:5432
        # The test runner creates test_<db>, so wait until the server truly accepts connections.
        options: >-
          --health-cmd "pg_isready -U teachorange"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://teachorange:teachorange@localhost:5432/teaching_activities
      # Throwaway, CI-only. Long enough that check --deploy does not flag W009.
      DJANGO_SECRET_KEY: HwwcQDBRUmk1raCW9FXjE8W1JYyUL7ohGESMH07TBD5tG7qGK2yKohHpyn6g564F
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # DJANGO_DEBUG must stay truthy here. settings.py enables SECURE_SSL_REDIRECT
      # when DEBUG is false, which makes the test client receive a 301 to https
      # instead of reaching any view.
      - name: Run tests
        env:
          DJANGO_DEBUG: "1"
        run: python manage.py test --verbosity 2

      # These checks are only meaningful with production settings active.
      # Fails on ERROR only. check --deploy also warns about HSTS
      # includeSubDomains (W005) and preload (W021); both are deliberate
      # decisions about the domain rather than things CI should force.
      - name: Django deployment checks
        env:
          DJANGO_DEBUG: "0"
        run: python manage.py check --deploy --fail-level ERROR
