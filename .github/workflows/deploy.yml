name: Deploy

on:
  push:
    branches: [main]
  # Allows a re-deploy of the current main without pushing a commit.
  workflow_dispatch:

# Queue overlapping merges instead of racing them onto the server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.teachorange.com

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # Fail the step if the remote script exits non-zero.
          script_stops: true
          command_timeout: 15m
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            # Bootstrap: the checkout on the server may predate deploy.sh (or carry
            # an older copy), so fetch the script itself before running it. This
            # only touches deploy.sh and leaves HEAD alone, so the script still
            # sees the true previous revision and can roll back to it.
            git fetch --all --prune
            git checkout origin/main -- deploy.sh
            chmod +x deploy.sh
            ./deploy.sh

      - name: Verify the site is serving the new code
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://www.teachorange.com/ || true)
            if [ "$code" = "200" ]; then
              echo "Site healthy (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code — retrying"
            sleep 6
          done
          echo "Site did not return 200 after deploy"
          exit 1
